<!doctype html>
<html><head><meta charset="utf-8"><title>Tarnation — asset picker</title>
<style>
  :root{--ink:#eef2ec;--muted:#9ba7a0;--faint:#64706a;--line:rgba(190,220,210,.18);--panel:rgba(7,13,12,.84);--teal:#98d8c9}
  *{box-sizing:border-box}
  body{margin:0;background:#0d1512;color:var(--ink);font-family:Inter,system-ui,sans-serif}
  header{padding:18px 24px;border-bottom:1px solid var(--line)}
  h1{margin:0;font-family:"Iowan Old Style",Baskerville,serif;font-size:22px;font-weight:600}
  p{margin:6px 0 0;color:var(--muted);font-size:13px}
  #grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px;padding:20px}
  .cell{background:var(--panel);border:1px solid var(--line);border-radius:10px;overflow:hidden}
  .cell canvas{display:block;width:100%;height:230px;background:linear-gradient(145deg,#283d2b,#111b16)}
  .name{padding:9px 12px;font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--teal);border-top:1px solid var(--line)}
  .detail{padding:0 12px 10px;color:var(--muted);font-size:11px}
</style></head>
<body>
<header>
  <h1>Presentation audit</h1>
  <p>Active sold buildings, fixed camp fixtures, and authored props under the game's loader and lighting. Drag a view to spin it.</p>
  <p id="status">Loading active presentation views…</p>
</header>
<div id="grid"></div>
<script type="module" src="/src/picker.ts"></script>
</body></html>
