name: Quality gates

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: quality-gates-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify application quality
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out the proposed or reviewed commit
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Typecheck with unused-symbol enforcement
        run: npx tsc --noEmit --noUnusedLocals --noUnusedParameters

      - name: Run simulation checks
        run: npm run check

      - name: Run deterministic unit and integration tests
        run: npm run test:ci

      - name: Validate assets and catalog
        run: npm run assetcheck

      - name: Validate authored audio and provenance
        run: npm run audiocheck

      - name: Run one-hour fixed-step feel soak
        run: npm run feelcheck

      - name: Run deterministic farm and raid performance scenarios
        run: npm run perfcheck

      - name: Audit production dependencies
        # Dev-tool advisories remain the explicitly reviewed REL-01 follow-up;
        # the shipped dependency tree must stay clean on every PR and main push.
        run: npm audit --omit=dev

      - name: Build production bundle
        run: npm run build

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run production-build E2E and visual checks
        run: npm run e2e:ci

      - name: Retain QA artifacts after a failure
        if: ${{ failure() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: quality-gate-artifacts-${{ github.run_id }}
          path: |
            qa-artifacts/**
            test-results/**
          if-no-files-found: ignore
          retention-days: 14
