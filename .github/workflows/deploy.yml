name: Verify and deploy production

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

concurrency:
  group: cloudflare-pages-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Verify and deploy to Cloudflare Pages
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out the reviewed commit
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Run simulation checks
        run: npm run check

      - name: Run deterministic unit characterization suite
        run: npm run test:ci

      - name: Validate assets and catalog
        run: npm run assetcheck

      - name: Validate authored audio and provenance
        run: npm run audiocheck

      - name: Run one-hour fixed-step feel soak
        run: npm run feelcheck

      - name: Run deterministic farm and raid performance scenarios
        run: npm run perfcheck

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run production E2E and visual checks
        run: npm run e2e:ci

      - name: Build production bundle
        run: npm run build

      - name: Deploy the verified bundle
        uses: cloudflare/wrangler-action@9acf94ace14e7dc412b076f2c5c20b8ce93c79cd # v3.15.0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "3.114.17"
          command: pages deploy dist --project-name=tarnation --branch=main
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
